version: "3"
services:
    mariadb:
        image: docker.io/mariadb
        networks:
            - wiki_network
        volumes:
            - ~/production/wiki/mariadb/data:/var/lib/mysql:Z
        env_file:
            - ~/production/wiki/mariadb/mariadb.env
        userns_mode: "keep-id:uid=999,gid=999"
        restart: always
        labels:
            - "io.containers.autoupdate=registry"

    mediawiki:
        image: shaderlabs/wiki
        networks:
            - wiki_network
        volumes:
            - ~/production/wiki/mediawiki/images:/var/www/html/images:Z
            - ~/production/wiki/mediawiki/LocalSettings.php:/var/www/html/LocalSettings.php:Z,ro
        ports:
            - "127.0.0.1:8080:80"
        restart: always
        depends_on:
            - mariadb

networks:
    wiki_network:
        driver: bridge
        internal: true
