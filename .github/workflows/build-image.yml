on:
    push:
        branches:
            - main
    workflow_dispatch:

name: Build & Push Images to GHCR

permissions:
    contents: read
    packages: write

env:
    REGISTRY: ghcr.io

concurrency:
    cancel-in-progress: true
    group: publish-ghcr

jobs:
    build:
        runs-on: ubuntu-26.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Build
              id: build_image
              uses: redhat-actions/buildah-build@v3
              with:
                image: ${{ env.REGISTRY }}/${{ github.repository }}
                context: container
                containerfiles: container/Containerfile
            - name: Push To GHCR
              uses: redhat-actions/push-to-registry@v3
              with:
                  image: ${{ steps.build_image.outputs.image }}
                  tags: ${{ steps.build_image.outputs.tags }}
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
